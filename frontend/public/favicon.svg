  <line x1="16" y1="12" x2="21.5" y2="17"   stroke="white" stroke-opacity="0.55" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="10" y1="21" x2="15"   y2="24.3" stroke="white" stroke-opacity="0.40" stroke-width="1.0" stroke-linecap="round"/>
  <line x1="22" y1="21" x2="17"   y2="24.3" stroke="white" stroke-opacity="0.40" stroke-width="1.0" stroke-linecap="round"/>
